<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B5E7B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icone_app_192.png">
<link rel="apple-touch-icon" href="./icone_app_192.png">
<title>Lista de Oradores</title>
<style>:root{--p:#1B5E7B;--pd:#123A4D;--pl:#E3F1F7;--txt:#1F2933;--mut:#5B6B76;--line:#DDE5EA;--bg:#F3F6F8;--card:#fff;--warn:#7A5200;--warnbg:#FFF4D6;--ok:#17653A;--okbg:#E3F4E8;--bad:#9B1C1C;--badbg:#FDE8E8;--acc:#2A7F9E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:var(--bg)}
#top{background:var(--pd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;min-height:54px}
#top h1{font-size:18px;margin:0;font-weight:600;flex:1}
#top button{background:transparent;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer;display:none}
#view{flex:1;overflow-y:auto;padding:12px 12px 90px}
#tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
#tabs button.on{color:var(--p);font-weight:600}
#tabs svg{width:24px;height:24px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.card h3{margin:0 0 6px;font-size:15px}
.sub{color:var(--mut);font-size:13px}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 4px 6px;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:24px;line-height:1.2;color:var(--pd)}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.warn{background:var(--warnbg);border-color:#f0dca0}.kpi.warn b,.kpi.warn span{color:var(--warn)}
.kpi.ok{background:var(--okbg);border-color:#bfe3cb}.kpi.ok b,.kpi.ok span{color:var(--ok)}
.kpi.wide{grid-column:1/-1;background:var(--pl);border-color:#c7e2ee}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.item .d{min-width:46px;text-align:center;background:var(--pl);border-radius:8px;padding:4px 2px;color:var(--pd)}
.item .d b{display:block;font-size:20px;line-height:1.1}.item .d small{font-size:11px;text-transform:uppercase}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-weight:600}
.item .m div{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;margin:3px 4px 0 0;background:var(--pl);color:var(--pd)}
.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}
.btn{border:1px solid var(--p);background:#fff;color:var(--p);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--p);color:#fff}.btn.danger{border-color:var(--bad);color:var(--bad)}.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn.block{display:block;width:100%;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.field{margin:0 0 10px}.field label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px;font-weight:600}
input,select,textarea{width:100%;border:1px solid #c3d0d8;border-radius:10px;padding:10px;font:inherit;background:#fff;color:var(--txt);min-height:44px}
textarea{min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.seg{display:flex;background:#e4ebef;border-radius:10px;padding:3px;margin:0 0 10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--mut);cursor:pointer;font-weight:600}
.seg button.on{background:#fff;color:var(--pd);box-shadow:0 1px 2px #0002}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;border:0;font-size:30px;box-shadow:0 3px 8px #0004;cursor:pointer;z-index:5}
.pick{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;background:var(--pd);color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:5}
.pick div{flex:1;font-size:13px}
#overlay{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
#overlay.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:18px;color:var(--pd)}
.alertbox{border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13px;background:var(--warnbg);color:var(--warn)}
.alertbox.okb{background:var(--okbg);color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#123A4Df2;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90%}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.bar{height:6px;background:var(--pl);border-radius:3px;margin-top:5px}.bar i{display:block;height:6px;background:var(--acc);border-radius:3px}
.pos{min-width:34px;text-align:center;font-weight:700;color:var(--p)}
.hero{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;border-radius:14px;padding:14px;margin:0 0 10px}
.hero small{opacity:.8}.hero b{display:block;font-size:20px;margin:2px 0}
.hero .btn{background:#fff;color:var(--pd);border-color:#fff}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}

.home-actions{margin:10px 0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.hero.outgoing{background:linear-gradient(135deg,#245846,#36765c)}
.hero .btn{margin-top:10px}

.theme-azul{--section:#1B5E7B;--section-dark:#123A4D}
.theme-indigo{--section:#394B85;--section-dark:#28365E}
.theme-petroleo{--section:#246775;--section-dark:#174651}
.theme-verde{--section:#36765c;--section-dark:#245846}
.theme-floresta{--section:#286044;--section-dark:#193F2D}
.theme-oliva{--section:#566729;--section-dark:#39461B}
.welcome{padding:8px 3px 18px}.welcome>span{font-size:15px;font-weight:600;color:var(--mut)}
.welcome h2{font-size:19px;line-height:1.35;margin:5px 0 7px;color:var(--pd)}.welcome p{margin:0;color:var(--mut);font-size:13px}
.home-section{padding:0 0 8px}.home-section+.home-section{border-top:1px solid var(--line);padding-top:20px;margin-top:4px}
.home-section .sec{color:var(--section);margin-top:6px}
.home-section .hero{background:linear-gradient(135deg,var(--section-dark),var(--section))}
.next-card{min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:18px}
.next-card b{margin:2px 0;font-size:21px}.next-card .next-topic{font-size:13px;opacity:.9;overflow-wrap:anywhere}
.home-section .btn{color:var(--section);border-color:var(--section)}.home-section .btn.primary{background:var(--section);color:#fff}
.home-section .kpi b{color:var(--section-dark)}
.home-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.home-actions .btn{font-size:14px;padding:10px 8px}
.palette-preview{margin-top:8px;border-radius:8px;padding:12px;color:#fff;background:linear-gradient(135deg,var(--section-dark),var(--section));font-size:13px}
.cong-speakers{margin:14px 0;padding:14px 0;border-top:1px solid var(--line)}.cong-speakers h3{font-size:15px;margin:0 0 10px}
.speaker-link{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:11px;margin-bottom:8px;color:var(--txt);font:inherit;cursor:pointer}.speaker-link small{color:var(--mut)}
</style>
</head>
<body>
<div id="app">
  <header id="top"><button id="back" aria-label="Voltar">‹</button><h1>Lista de Oradores</h1></header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-go="inicio"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-go="prog"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Programação</button>
    <button data-go="escalar"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.6 3.5 5"/></svg>Escalar</button>
    <button data-go="pend"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>Pendências</button>
    <button data-go="mais"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Mais</button>
  </nav>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script>/* Lista de Oradores — lógica (sem interface). Datas internas = número de dias desde 1970-01-01 (UTC). */
(function (root) {
  const p2 = n => String(n).padStart(2, '0');
  const D = {
    parse(s) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return NaN;
      const [y, m, d] = s.split('-').map(Number), t = new Date(0);
      t.setUTCFullYear(y, m - 1, d);
      return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d ? t.getTime() / 86400000 : NaN;
    },
    iso(n) { const t = new Date(n * 86400000); return t.getUTCFullYear() + '-' + p2(t.getUTCMonth() + 1) + '-' + p2(t.getUTCDate()); },
    today() { const t = new Date(); return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 86400000; },
    dow(n) { return new Date(n * 86400000).getUTCDay(); },
    year(n) { return new Date(n * 86400000).getUTCFullYear(); },
    br(n) { const t = new Date(n * 86400000); return p2(t.getUTCDate()) + '/' + p2(t.getUTCMonth() + 1); },
    brFull(n) { const t = new Date(n * 86400000); return p2(t.getUTCDate()) + '/' + p2(t.getUTCMonth() + 1) + '/' + t.getUTCFullYear(); },
    dow3(n) { return ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'][D.dow(n)]; },
    dowFull(n) { return ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'][D.dow(n)]; },
    fromSerial(s) { return Math.floor(s) - 25569; }
  };
  const norm = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const key = s => norm(s).toLowerCase();
  const num = v => { const n = Number(String(v).replace(',', '.')); return isFinite(n) && String(v).trim() !== '' ? n : null; };
  let _id = 0; const newId = () => 'p' + Date.now().toString(36) + (++_id).toString(36) + Math.random().toString(36).slice(2, 5);

  function emptyState() {
    return { v: 1, config: { intervalo: 90, diaSemana: 0, diasPendencias: 30, horaPadrao: '17h', modelo: '', local: '' }, oradores: [], congregacoes: [], horarios: {}, esbocos: [], prog: [] };
  }
  function restoreState(s) {
    if (!s || s.v !== 1 || !['prog', 'oradores', 'esbocos'].every(k => Array.isArray(s[k]))) throw new Error('estrutura de backup inválida');
    const validString = value => typeof value === 'string';
    if (!s.oradores.every(o => o && validString(o.nome) && norm(o.nome) && validString(o.cong)) ||
        !s.esbocos.every(e => e && Number.isInteger(e.n) && e.n > 0 && validString(e.tema)) ||
        !s.prog.every(p => p && validString(p.orador) && Number.isFinite(D.parse(p.data)) && (p.esboco == null || p.esboco === '' || (Number.isInteger(p.esboco) && p.esboco > 0)))) throw new Error('registros inválidos no backup');
    const out = JSON.parse(JSON.stringify(s)), defaults = emptyState();
    out.config = Object.assign(defaults.config, out.config);
    for (const k of ['intervalo', 'diasPendencias', 'diaSemana']) {
      if (!Number.isInteger(out.config[k]) || out.config[k] < (k === 'diasPendencias' ? 1 : 0) || (k === 'diaSemana' && out.config[k] > 6)) throw new Error('configurações inválidas');
    }
    out.congregacoes = out.congregacoes || [];
    if (!Array.isArray(out.congregacoes) || !out.congregacoes.every(validString)) throw new Error('congregações inválidas');
    out.horarios = out.horarios || {};
    if (typeof out.horarios !== 'object' || Array.isArray(out.horarios)) throw new Error('horários inválidos');
    const ids = new Set();
    out.prog.forEach(p => { if (typeof p.id !== 'string' || !p.id || ids.has(p.id)) p.id = newId(); ids.add(p.id); });
    if (typeof out.config.local !== 'string') throw new Error('congregação local inválida');
    out.prog.forEach(p => {
      if (p.tipo != null && !['local', 'envio'].includes(p.tipo)) throw new Error('modalidade inválida');
      for (const k of ['origem', 'destino']) if (p[k] != null && typeof p[k] !== 'string') throw new Error('congregação inválida');
      if (p.tipo === 'envio' && (!norm(p.origem) || !norm(p.destino) || key(p.origem) === key(p.destino))) throw new Error('envio sem origem e destino distintos');
    });
    return out;
  }
  function congDe(st, nome) { const o = st.oradores.find(o => key(o.nome) === key(nome)); return o ? o.cong : ''; }
  function temaDe(st, n) { const e = st.esbocos.find(e => e.n === Number(n)); return e ? norm(e.tema) : ''; }
  function allCongs(st) {
    const set = new Map();
    st.oradores.forEach(o => { if (norm(o.cong)) set.set(key(o.cong), norm(o.cong)); });
    if (norm(st.config.local)) set.set(key(st.config.local), norm(st.config.local));
    st.prog.forEach(p => { for (const c of [p.origem, p.destino]) if (norm(c)) set.set(key(c), norm(c)); });
    st.congregacoes.forEach(c => { if (norm(c)) set.set(key(c), norm(c)); });
    return [...set.values()].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  }
  // Registros antigos continuam locais; os novos guardam origem e destino históricos.
  function origemDe(st, p) { return norm(p.origem) || congDe(st, p.orador); }
  function destinoDe(st, p) { return norm(p.destino) || (p.tipo === 'envio' ? '' : norm(st.config.local)); }
  function localRows(st) { return rows(st).filter(p => p.tipo !== 'envio'); }
  function participa(r, c) { return key(r.origem) === key(c) || key(r.destino) === key(c); }
  function arranjos(st) {
    const R = rows(st);
    return allCongs(st).filter(c => key(c) !== key(st.config.local)).map(nome => ({ nome,
      recebidos: R.filter(r => r.tipo !== 'envio' && key(r.origem) === key(nome)).length,
      enviados: R.filter(r => r.tipo === 'envio' && key(r.destino) === key(nome)).length,
      proximos: R.filter(r => participa(r, nome) && r.d >= D.today()).length
    }));
  }
  function rows(st) {
    return st.prog.filter(p => p.data).map(p => ({ ...p, d: D.parse(p.data), tipo: p.tipo || 'local', origem: origemDe(st, p), destino: destinoDe(st, p), cong: origemDe(st, p) }));
  }
  /* ---------- alerta de repetição ---------- */
  function alerta(st, row) {
    const N = Number(st.config.intervalo) || 0, d = D.parse(row.data);
    const others = st.prog.filter(p => p.id !== row.id && p.data);
    const pick = fn => others.find(fn) || null;
    const orador = row.tipo !== 'envio' && norm(row.orador) ? pick(p => p.tipo !== 'envio' && key(p.orador) === key(row.orador) && Math.abs(D.parse(p.data) - d) < N) : null;
    const esboco = row.tipo !== 'envio' && row.esboco ? pick(p => p.tipo !== 'envio' && key(destinoDe(st, p)) === key(destinoDe(st, row)) && Number(p.esboco) === Number(row.esboco) && Math.abs(D.parse(p.data) - d) < N) : null;
    const conflito = norm(row.orador) ? pick(p => key(p.orador) === key(row.orador) && D.parse(p.data) === d) : null;
    return { orador, esboco, conflito, any: !!(orador || esboco) };
  }
  /* ---------- histórico: último (<= ref) e próximo (> ref) ---------- */
  function lastNext(list, ref) {
    let last = null, next = null;
    for (const r of list) {
      if (r.d <= ref) { if (!last || r.d > last.d) last = r; }
      else if (!next || r.d < next.d) next = r;
    }
    return { last, next };
  }
  const sortNever = (a, b) => (a.lastD == null ? -1e12 : a.lastD) - (b.lastD == null ? -1e12 : b.lastD);
  /* ---------- Escalar ---------- */
  function escalar(st, dateISO, N, congFilter) {
    const d = D.parse(dateISO), R = rows(st); N = Number(N);
    const oradores = [];
    st.oradores.forEach((o, idx) => {
      if (congFilter && key(o.cong) !== key(congFilter)) return;
      const mine = R.filter(r => key(r.orador) === key(o.nome));
      const busy = mine.find(r => r.d === d || (r.tipo !== 'envio' && Math.abs(r.d - d) < N));
      const { last, next } = lastNext(mine, d);
      oradores.push({ nome: o.nome, cong: o.cong, livre: !busy, conflito: busy || null, lastD: last ? last.d : null, dias: last ? d - last.d : null, lastEsb: last ? last.esboco : null, next: next ? next.d : null, idx });
    });
    const disponiveis = oradores.filter(o => o.livre).sort(sortNever);
    const congs = allCongs(st).map((c, idx) => {
      const mine = R.filter(r => participa(r, c));
      const { last, next } = lastNext(mine, d);
      return { nome: c, lastD: last ? last.d : null, dias: last ? d - last.d : null, lastOrador: last ? last.orador : null, next: next ? next.d : null, nextOrador: next ? next.orador : null, idx };
    }).sort(sortNever);
    const esbocos = st.esbocos.map((e, idx) => {
      const mine = R.filter(r => r.tipo !== 'envio' && Number(r.esboco) === e.n);
      const busy = mine.find(r => Math.abs(r.d - d) < N);
      const { last, next } = lastNext(mine, d);
      return { n: e.n, tema: norm(e.tema), livre: !busy, lastD: last ? last.d : null, dias: last ? d - last.d : null, lastOrador: last ? last.orador : null, next: next ? next.d : null, nextOrador: next ? next.orador : null, idx };
    });
    const esbDisp = esbocos.filter(e => e.livre).sort(sortNever);
    return { disponiveis, total: oradores.length, congs, esbDisp, esbLivres: esbDisp.length };
  }
  /* ---------- Rodízio (referência = hoje) ---------- */
  function rodizio(st, ref) {
    const R = rows(st);
    const oradores = st.oradores.map((o, idx) => {
      const mine = R.filter(r => key(r.orador) === key(o.nome)); const { last, next } = lastNext(mine, ref);
      return { nome: o.nome, cong: o.cong, lastD: last ? last.d : null, dias: last ? ref - last.d : null, lastEsb: last ? last.esboco : null, next: next ? next.d : null, nextEsb: next ? next.esboco : null, idx };
    }).sort(sortNever);
    const congs = allCongs(st).map((c, idx) => {
      const mine = R.filter(r => participa(r, c)); const { last, next } = lastNext(mine, ref);
      return { nome: c, lastD: last ? last.d : null, dias: last ? ref - last.d : null, lastOrador: last ? last.orador : null, next: next ? next.d : null, nextOrador: next ? next.orador : null, idx };
    }).sort(sortNever);
    const esbocos = st.esbocos.map((e, idx) => {
      const mine = R.filter(r => Number(r.esboco) === e.n); const { last, next } = lastNext(mine, ref);

  expJ: () => { download(new Blob([JSON.stringify(st)], { type: 'application/json' }), 'Lista_de_Oradores_backup_' + D.iso(D.today()) + '.json'); toast('Backup salvo.'); },
  wipe: () => { if (confirm('Apagar TODOS os dados deste aparelho? Isso não pode ser desfeito.')) { st = C.emptyState(); save(); render(); toast('Dados apagados.'); } },
  mesclar: () => applyImport(ui.imp, 'merge'), substituir: () => applyImport(ui.imp, 'replace'),
  instalar: () => { const e = window.__installEv; if (e) { e.prompt(); window.__installEv = null; } }
};
const CH = {
  palette: el => { if (!['local','envio'].includes(el.dataset.kind) || !Object.hasOwn(PALETTES, el.value)) return; st.config[el.dataset.kind + 'Palette'] = el.value; save(); render(); toast('Cores salvas.'); },
  contactFile: async el => {
    const file = el.files[0], form = ui.form; if (!file) return;
    try {
      if (file.size > 2 * 1024 * 1024) throw new Error('Escolha um arquivo de contato de até 2 MB.');
      const text = await file.text();
      if (ui.form !== form || !document.querySelector('#o_fone')) return;
      chooseContactPhone(C.vcardPhones(text));
    } catch (e) { toast('Não foi possível importar o contato: ' + e.message); }
    finally { el.value = ''; }
  },
  cmpTipo: el => { ui.comp.tipo = el.value; ui.comp.orador = ''; render(); },
  cmpOrador: el => { ui.comp.orador = el.value; render(); },
  relTipo: el => { ui.rel.tipo = el.value; ui.rel.n = 30; render(); },
  histTipo: el => { ui.hist.modalidade = el.value; render(); },
  progTipo: el => { ui.prog.tipo = el.value; render(); },
  contactNumber: el => { if (el.value) $('#o_fone').value = el.value; },
  formTipo: el => { ui.form.tipo = el.value; $('#f_dest').disabled = el.value !== 'envio'; $('#f_dest').value = el.value === 'local' ? st.config.local : ''; formChg(); },
  cfgLocal: el => { const name = norm(el.value); if (st.config.local && key(name) !== key(st.config.local) && st.prog.length) { toast('Para preservar os arranjos, renomeie a congregação no cadastro.'); el.value = st.config.local; return; } st.config.local = name; if (name) st.prog.forEach(p => { if (!p.tipo || p.tipo === 'local') { p.tipo = 'local'; if (!p.destino) p.destino = name; if (!p.origem) p.origem = C.congDe(st, p.orador); } }); save(); toast('Congregação local salva.'); },
  escData: el => { ui.esc.data = el.value; render(); }, escInt: el => { ui.esc.int = Math.max(0, Number(el.value) || 0); render(); }, escCong: el => { ui.esc.cong = el.value; ui.esc.no = 8; render(); },
  pendDias: el => { ui.pend.dias = Number(el.value); render(); }, msgDias: el => { ui.msgs.dias = Number(el.value); render(); },
  cfgHora: el => { st.config.horaPadrao = norm(el.value); save(); toast('Salvo.'); }, cfgModelo: el => { st.config.modelo = el.value.trim() === C.MODELO_PADRAO ? '' : el.value; save(); toast('Salvo.'); },
  livIni: el => { ui.livres.ini = el.value; render(); }, livFim: el => { ui.livres.fim = el.value; render(); }, livDow: el => { ui.livres.dow = Number(el.value); render(); },
  cmpIni: el => { ui.comp.ini = el.value; render(); }, cmpFim: el => { ui.comp.fim = el.value; render(); },
  relAno: el => { ui.rel.ano = el.value; render(); },
  formChg,
  cfgInt: el => { st.config.intervalo = Math.max(0, Number(el.value) || 0); save(); ui.esc.int = null; toast('Salvo.'); }, cfgDow: el => { st.config.diaSemana = Number(el.value); save(); toast('Salvo.'); }, cfgPend: el => { st.config.diasPendencias = Math.max(1, Number(el.value) || 30); save(); toast('Salvo.'); },
  impFile: async el => { const f = el.files[0]; if (!f) return; try { await ensureXLSX(); const res = C.importWorkbook(XLSX, await f.arrayBuffer()); ui.imp = res; const nada = !res.prog.length && !res.oradores.length && !res.esbocos.length; sheet('<h2>Importar planilha</h2><div class="card"><div class="sub">Encontrei:</div><b>' + res.prog.length + '</b> discursos · <b>' + res.oradores.length + '</b> oradores · <b>' + res.esbocos.length + '</b> esboços<br><span class="sub">' + res.abas.map(esc).join('<br>') + '</span>' + (res.avisos.length ? '<div class="alertbox" style="margin-top:8px">' + res.avisos.map(esc).join('<br>') + '</div>' : '') + '</div>' + (nada ? '' : '<button class="btn primary block" data-act="mesclar">Mesclar com meus dados</button><button class="btn block" data-act="substituir">Substituir meus dados</button>') + '<button class="btn block" data-act="closeSheet">Cancelar</button>'); } catch (e) { toast('Não consegui ler o arquivo: ' + e.message); } el.value = ''; },
  impJson: async el => { const f = el.files[0]; if (!f) return; try { const restored = C.restoreState(JSON.parse(await f.text())); if (confirm('Restaurar o backup e substituir os dados atuais?')) { st = restored; save(); go('inicio'); toast('Backup restaurado.'); } } catch (e) { toast('Backup inválido: ' + e.message); } el.value = ''; }
};
const INP = { formChg, rodQ: el => { ui.rod.q = el.value; ui.rod.n = 30; render(); const i = $('input[data-inp="rodQ"]'); if (i) { i.focus(); i.setSelectionRange(99, 99); } }, cadQ: el => { ui.cad.q = el.value; render(); const i = $('input[data-inp="cadQ"]'); if (i) { i.focus(); i.setSelectionRange(99, 99); } } };
document.addEventListener('click', e => {
  if (e.target.id === 'overlay') { closeSheet(); return; }
  const el = e.target.closest('[data-act],[data-go]'); if (!el) return;
  if (el.dataset.act && A[el.dataset.act]) A[el.dataset.act](el, e); else if (el.dataset.go) go(el.dataset.go);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CH[el.dataset.chg]) CH[el.dataset.chg](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
$('#back').addEventListener('click', () => { if (ui.route === 'hist') { if (ui.hstack.length) { ui.hist = ui.hstack.pop(); render(true); } else go(ui.hfrom || 'cadastros'); } else go('mais'); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installEv = e; if (ui.route === 'mais') render(); });
render(true);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__app = { get st() { return st; }, ui, go, render, openProg };
})();
</script>
